{% extends 'base.html' %}
{% block content %}
<h1>{{ titulo }}</h1>
<form method="post">
  {% csrf_token %}
  {% for campo in form %}
    <div class="mb-3">
      {{ campo.label_tag }}
      {{ campo }}
      {% for error in campo.errors %}
        <div class="text-danger small">{{ error }}</div>
      {% endfor %}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-success">Guardar</button>
  <a href="{% url 'catalogo' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
